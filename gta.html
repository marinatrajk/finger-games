<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Question</title>
<style>
  :root { --bg: #f6f1e9; --fg: #1d1b22; --yes: #2fbf71; --no: #e5484d; --muted: #4a4752; --dot: #5b8cff;
    --veil: rgba(246, 241, 233, 0.5); --glow: rgba(255, 255, 255, 0.85); }
  @media (prefers-color-scheme: dark) { :root { --bg: #141219; --fg: #f4f1ea; --muted: #c9c6d1;
    --veil: rgba(20, 18, 25, 0.5); --glow: rgba(0, 0, 0, 0.8); } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  /* the camera, full screen and mirrored, behind everything */
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 0; }
  #veil { position: fixed; inset: 0; background: var(--veil); z-index: 0; pointer-events: none; }
  main { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  .q { text-align: center; }
  h1 { font-size: clamp(34px, 7vw, 84px); margin: 0 0 44px; letter-spacing: -0.02em; font-weight: 800; line-height: 1.05;
    text-shadow: 0 0 18px var(--glow), 0 0 4px var(--glow); }
  #yes, #no { box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
  .row { display: flex; gap: 28px; justify-content: center; align-items: center; }
  button { font: inherit; font-weight: 800; font-size: clamp(22px, 3vw, 34px); border: 0; border-radius: 999px;
    padding: 18px 52px; cursor: pointer; color: #fff; }
  #no { background: var(--no); position: relative; overflow: hidden; }
  #no span { position: relative; }
  #no .fill { position: absolute; inset: 0; background: rgba(255,255,255,.38); transform-origin: left; transform: scaleX(0); }
  #yes { background: var(--yes); position: fixed; left: 0; top: 0; z-index: 2; will-change: transform;
    transition: transform .3s cubic-bezier(.2,.9,.3,1.25); }
  #slot { visibility: hidden; }
  .answer h1 { margin: 0; }
  .answer .row, .answer ~ #yes { display: none; }
  #dot { position: fixed; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
    background: var(--dot); box-shadow: 0 0 0 7px rgba(91,140,255,.25); pointer-events: none; z-index: 5; opacity: 0; transition: opacity .15s; }
  /* the emoji over your face: the layer is moved/rotated/scaled to follow the face (face = 100 units wide) */
  #face { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 1; pointer-events: none;
    transform-origin: 0 0; opacity: 0; transition: opacity .2s; }
  #facemoji { position: absolute; left: 0; top: -10px; font-size: 175px; line-height: 1; white-space: nowrap;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; transform: translate(-50%, -50%); }
  #facemoji.swap { animation: swap .3s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes swap { from { transform: translate(-50%, -50%) scale(.6) rotate(-12deg); } }
  h1 { transition: opacity .4s; }
  h1.gone { opacity: 0; }
  #status { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 14px; color: var(--muted);
    transition: opacity .6s; white-space: nowrap; pointer-events: none; }
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<div id="veil"></div>
<div id="face"><div id="facemoji"></div></div>
<main>
  <div class="q" id="card">
    <h1 id="title">Have you played GTA6?</h1>
    <div class="row">
      <button id="slot" tabindex="-1" aria-hidden="true">Yes</button>
      <button id="no"><div class="fill"></div><span>No</span></button>
    </div>
  </div>
  <button id="yes">Yes</button>
</main>
<div id="dot"></div>
<div id="status"></div>

<script type="module">
const CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const QUESTION = "Have you played GTA6?";
const ANSWER = "Correct. Nobody has. 🫠";
const FACE_MODEL = "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";
// the emoji that replaces your face, one step angrier per miss (then random ones after the list runs out)
const FACES = ["😅", "😬", "😤", "😠", "😡", "🤬", "😭", "🥲", "🙃", "😵‍💫", "🫠", "🤡", "💀", "🗿"];

const $ = id => document.getElementById(id);
const yes = $("yes"), slot = $("slot"), no = $("no"), fill = no.querySelector(".fill");
const card = $("card"), title = $("title"), dot = $("dot"), statusEl = $("status"), video = $("v");
const rand = (a, b) => a + Math.random() * (b - a);

let statusTimer;
function setStatus(t, hideAfter) {
  statusEl.textContent = t; statusEl.style.opacity = t ? 1 : 0;
  clearTimeout(statusTimer); if (hideAfter) statusTimer = setTimeout(() => statusEl.style.opacity = 0, hideAfter);
}

// ---------- sound ----------
let actx = null;
function unlockAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume().catch(() => {});
}
addEventListener("pointerdown", unlockAudio); addEventListener("keydown", unlockAudio);
function boing() {
  if (!actx || actx.state !== "running") return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(880, t + 0.12);
  o.frequency.exponentialRampToValueAtTime(440, t + 0.22);
  g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.27);
}

// ---------- the runaway Yes button ----------
let pos = { x: 0, y: 0 }, moved = false, lastFlee = 0;
function place(x, y, instant) {
  pos = { x, y };
  if (instant) yes.style.transition = "none";
  yes.style.transform = `translate(${x}px, ${y}px)`;
  if (instant) { yes.offsetHeight; yes.style.transition = ""; }
}
function alignToSlot() { const r = slot.getBoundingClientRect(); place(r.left, r.top, true); }
function clampIntoView() {
  const m = 16, w = yes.offsetWidth, h = yes.offsetHeight;
  place(Math.min(Math.max(pos.x, m), innerWidth - w - m), Math.min(Math.max(pos.y, m), innerHeight - h - m), true);
}
addEventListener("resize", () => moved ? clampIntoView() : alignToSlot());
alignToSlot();

const overlaps = (a, b, pad = 0) => a.x < b.right + pad && a.x + a.w > b.left - pad && a.y < b.bottom + pad && a.y + a.h > b.top - pad;
function rectDist(p, x, y, w, h) {
  const dx = Math.max(x - p.x, 0, p.x - (x + w)), dy = Math.max(y - p.y, 0, p.y - (y + h));
  return Math.hypot(dx, dy);
}


function flee(ptrs, now) {
  const m = 16, w = yes.offsetWidth, h = yes.offsetHeight;
  if (!started) { started = true; title.classList.add("gone"); } // the question disappears once you start
  const avoid = [no.getBoundingClientRect()];
  const cands = [];
  for (let i = 0; i < 60; i++) {
    const c = { x: rand(m, Math.max(m, innerWidth - w - m)), y: rand(m, Math.max(m, innerHeight - h - m)), w, h };
    const cx = c.x + w / 2, cy = c.y + h / 2;
    let score = Math.min(...ptrs.map(p => Math.hypot(p.x - cx, p.y - cy)));
    if (avoid.some(r => overlaps(c, r, 12))) score -= 10000; // don't cover "No"
    cands.push({ c, score });
  }
  cands.sort((a, b) => b.score - a.score);
  const { c } = cands[(Math.random() * 4) | 0]; // one of the best few, so it isn't predictable
  place(c.x, c.y);
  moved = true; lastFlee = now;
  boing();
  swapFace();
}

// ---------- the emoji over your face ----------
const faceEl = $("face"), faceMoji = $("facemoji");
const face = { x: 0, y: 0, w: 0, a: 0, active: false, seen: -1e9 };
let misses = 0, started = false;
function swapFace() {
  misses++;
  let next = FACES[misses - 1];
  if (!next) do { next = FACES[(Math.random() * FACES.length) | 0]; } while (next === faceMoji.textContent);
  faceMoji.textContent = next;
  faceMoji.classList.remove("swap"); void faceMoji.offsetWidth; faceMoji.classList.add("swap"); // replay the pop
}
function resetFace() { faceMoji.textContent = ""; misses = 0; }

// a keyboard or touch "press" on Yes also makes it run
yes.addEventListener("click", e => { e.preventDefault(); flee([{ x: pos.x + yes.offsetWidth / 2, y: pos.y + yes.offsetHeight / 2 }], performance.now()); });
yes.addEventListener("pointerdown", e => { e.preventDefault(); flee([{ x: e.clientX, y: e.clientY }], performance.now()); });

// ---------- "No" (click it, or hold your fingertip on it) ----------
let noHold = 0, answered = false;
function answer() {
  if (answered) return;
  answered = true; noHold = 0; fill.style.transform = "scaleX(0)";
  title.textContent = ANSWER; title.classList.remove("gone"); card.classList.add("answer");
  setTimeout(() => {
    title.textContent = QUESTION; card.classList.remove("answer"); answered = false;
    moved = false; requestAnimationFrame(alignToSlot); resetFace(); started = false;
  }, 3500);
}
no.addEventListener("click", answer);

// ---------- pointers: fingertip(s) + mouse ----------
const mouse = { x: -1e4, y: -1e4, active: false };
addEventListener("pointermove", e => { if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; } });
document.addEventListener("mouseleave", () => { mouse.active = false; });

let landmarker = null, faceDetector = null, camOK = false, lastVideoTime = -1, faceTurn = false;
const finger = { x: 0, y: 0, active: false, seen: -1e9 };

async function init() {
  setStatus("📷 allow the camera to use your finger");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false });
    video.srcObject = stream; await video.play(); camOK = true;
  } catch (e) { setStatus("no camera, so use your mouse", 4000); return; }
  setStatus("🧠 loading hand + face tracker…");
  try {
    const { HandLandmarker, FaceDetector, FilesetResolver } = await import(`${CDN}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`${CDN}/wasm`);
    const make = async (Task, model, extra) => {
      const opts = delegate => ({ baseOptions: { modelAssetPath: model, delegate }, runningMode: "VIDEO", ...extra });
      try { return await Task.createFromOptions(fileset, opts("GPU")); }
      catch (e) { return await Task.createFromOptions(fileset, opts("CPU")); }
    };
    landmarker = await make(HandLandmarker, MODEL, { numHands: 1 });
    try { faceDetector = await make(FaceDetector, FACE_MODEL, { minDetectionConfidence: 0.5 }); }
    catch (e) { console.warn("face detector didn't load", e); }
    setStatus("☝️ point your index finger at the screen", 3500);
  } catch (e) { console.error(e); setStatus("hand tracker didn't load, so use your mouse", 4000); }
}
init();

function detect(now) {
  if (!camOK || video.readyState < 2 || video.currentTime === lastVideoTime || !video.videoWidth) return;
  lastVideoTime = video.currentTime;
  // map like a full-screen mirror ("cover" fit, flipped horizontally), same as the <video> on screen
  const vw = video.videoWidth, vh = video.videoHeight, W = innerWidth, H = innerHeight;
  const s = Math.max(W / vw, H / vh), w = vw * s, h = vh * s, ox = (W - w) / 2, oy = (H - h) / 2;
  const toScreen = (nx, ny) => ({ x: ox + (1 - nx) * w, y: oy + ny * h });

  if (landmarker) {
    let res = null; try { res = landmarker.detectForVideo(video, now); } catch (e) {}
    const lm = res && res.landmarks && res.landmarks[0];
    if (lm) {
      const t = toScreen(lm[8].x, lm[8].y);
      if (!finger.active) { finger.x = t.x; finger.y = t.y; }
      else { finger.x += (t.x - finger.x) * 0.7; finger.y += (t.y - finger.y) * 0.7; }
      finger.active = true; finger.seen = now;
    }
  }

  // face every other camera frame is plenty
  faceTurn = !faceTurn;
  if (faceDetector && faceTurn) {
    let res = null; try { res = faceDetector.detectForVideo(video, now); } catch (e) {}
    const d = res && res.detections && res.detections[0];
    if (d && d.boundingBox) {
      const bb = d.boundingBox; // in video pixels
      const c = toScreen((bb.originX + bb.width / 2) / vw, (bb.originY + bb.height / 2) / vh);
      const fw = bb.width * s;
      let a = 0;
      const k = d.keypoints;
      if (k && k.length >= 2) { // tilt from the two eyes
        const e1 = toScreen(k[0].x, k[0].y), e2 = toScreen(k[1].x, k[1].y);
        const [L, R] = e1.x < e2.x ? [e1, e2] : [e2, e1];
        a = Math.atan2(R.y - L.y, R.x - L.x);
      }
      if (!face.active) Object.assign(face, { x: c.x, y: c.y, w: fw, a });
      else { face.x += (c.x - face.x) * 0.6; face.y += (c.y - face.y) * 0.6; face.w += (fw - face.w) * 0.4; face.a += (a - face.a) * 0.5; }
      face.active = true; face.seen = now;
    }
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  detect(now);
  if (finger.active && now - finger.seen > 250) finger.active = false;
  dot.style.opacity = finger.active ? 1 : 0;
  if (finger.active) dot.style.transform = `translate(${finger.x}px, ${finger.y}px)`;
  if (face.active && now - face.seen > 600) face.active = false;
  faceEl.style.opacity = face.active ? 1 : 0;
  if (face.active) faceEl.style.transform = `translate(${face.x}px, ${face.y}px) rotate(${face.a}rad) scale(${face.w / 100})`;

  const ptrs = [...(finger.active ? [finger] : []), ...(mouse.active ? [mouse] : [])];
  if (!answered && ptrs.length) {
    const w = yes.offsetWidth, h = yes.offsetHeight;
    const near = ptrs.some(p => rectDist(p, pos.x, pos.y, w, h) < 70);
    if (near && now - lastFlee > 120) flee(ptrs, now);

    // fingertip resting on "No" presses it
    const r = no.getBoundingClientRect();
    const onNo = finger.active && finger.x > r.left && finger.x < r.right && finger.y > r.top && finger.y < r.bottom;
    noHold = onNo ? noHold + dt : Math.max(0, noHold - dt * 2);
    fill.style.transform = `scaleX(${Math.min(noHold / 0.8, 1)})`;
    if (noHold >= 0.8) answer();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// tiny hook for testing without a camera: __fakeFace({ x, y, w, a })
window.__fakeFace = f => Object.assign(face, f, { active: true, seen: performance.now() + 1e9 });
</script>
</body>
</html>
